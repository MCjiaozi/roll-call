name: Deploy Next to MicroK8s

on:
  workflow_dispatch:
    inputs:
      deploy_registry:
        description: 镜像仓库
        type: choice
        required: true
        default: cnb
        options:
          - cnb
          - ghcr

env:
  GHCR_REPOSITORY: ghcr.io/mcjiaozi/roll-call
  CNB_REPOSITORY: mcjiaozi/roll-call
  CNB_IMAGE_REPOSITORY: docker.cnb.cool/mcjiaozi/roll-call
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}"
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # CNB needs the source commit's history when receiving it over Git.
          fetch-depth: 0

      - name: Select image repository
        env:
          DEPLOY_REGISTRY: ${{ inputs.deploy_registry }}
        run: |
          case "$DEPLOY_REGISTRY" in
            cnb) IMAGE_REPOSITORY="$CNB_IMAGE_REPOSITORY"; PULL_SECRET=cnb-credentials ;;
            ghcr) IMAGE_REPOSITORY="$GHCR_REPOSITORY"; PULL_SECRET=ghcr-credentials ;;
            *) echo '::error::Invalid deployment registry'; exit 1 ;;
          esac
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "PULL_SECRET=$PULL_SECRET" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: inputs.deploy_registry == 'ghcr'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Node.js for CNB orchestration
        if: inputs.deploy_registry == 'cnb'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and push image on CNB
        if: inputs.deploy_registry == 'cnb'
        timeout-minutes: 25
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: node .github/scripts/cnb-build.mjs

      - name: Build and push Docker image
        if: inputs.deploy_registry == 'ghcr'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          target: runner
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Transfer YAML file to server
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "roll-call.yaml"
          target: "~/projects/"

      - name: Deploy to MicroK8s
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_REPOSITORY,PULL_SECRET,IMAGE_TAG
          script: |
            set -eu
            cd ~/projects/

            # Check credentials before changing the running application.
            microk8s.kubectl get secret "$PULL_SECRET" >/dev/null

            sed -i "s|\$IMAGE_REPOSITORY|$IMAGE_REPOSITORY|g; s|\$IMAGE_TAG|$IMAGE_TAG|g; s|\$PULL_SECRET|$PULL_SECRET|g" roll-call.yaml

            microk8s.kubectl apply -f roll-call.yaml
            
            microk8s.kubectl rollout status deployment/roll-call-deployment --timeout=600s